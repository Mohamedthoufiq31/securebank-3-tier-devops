spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${DB_USERNAME:securebank}
    password: ${DB_PASSWORD:securebank-dev-only}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:demo-user}
    password: ${SMTP_PASSWORD:demo-pass}
    test-connection: false
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
server:
  port: 8080
  error:
    include-message: always
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:admin@securebank.local}
  admin-password: ${ADMIN_PASSWORD:ChangeMe-Dev-Only-123!}
  mail-from: ${MAIL_FROM:securebank@localhost}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
